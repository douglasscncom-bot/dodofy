name: Deploy PokeTracker GO

on:
  push:
    branches:
      - main
      - claude/pokemon-go-battle-app-eq68i7
    paths:
      - 'pokemon-tracker/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: pokemon-tracker/package-lock.json

      - name: Install dependencies
        working-directory: pokemon-tracker
        run: npm ci

      - name: Build
        working-directory: pokemon-tracker
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pokemon-tracker/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
