name: Deploy PokeTracker GO

on:
  push:
    branches:
      - main
      - claude/pokemon-go-battle-app-eq68i7
    paths:
      - 'pokemon-tracker/**'
      - '.github/workflows/deploy-pokemon-tracker.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: pokemon-tracker/package-lock.json

      - name: Install dependencies
        working-directory: pokemon-tracker
        run: npm ci

      - name: Build Pokemon Tracker
        working-directory: pokemon-tracker
        run: npm run build

      - name: Assemble deploy folder
        run: |
          mkdir -p _deploy/pokemon-tracker

          # Copy existing website files (root of repo)
          rsync -av --exclude='pokemon-tracker' \
                    --exclude='.github' \
                    --exclude='.git' \
                    --exclude='node_modules' \
                    --exclude='_deploy' \
                    . _deploy/

          # Copy built Pokemon Tracker into subfolder
          cp -r pokemon-tracker/dist/. _deploy/pokemon-tracker/

          echo "=== Deploy folder structure ==="
          ls _deploy/
          echo "=== pokemon-tracker subfolder ==="
          ls _deploy/pokemon-tracker/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _deploy

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
