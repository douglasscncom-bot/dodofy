<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Douglas Soares - Dodofy</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #030a1c 0%, #0a1a3a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            width: 100%;
        }
        .profile {
            text-align: center;
            margin-bottom: 40px;
        }
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto 20px;
            border: 4px solid #2c7cff;
            overflow: hidden;
            background: rgba(94, 163, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
        }
        .name {
            font-size: 28px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 8px;
        }
        .title {
            font-size: 16px;
            color: #a8bcd6;
            margin-bottom: 30px;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .link {
            display: block;
            padding: 16px;
            background: rgba(44, 124, 255, 0.15);
            border: 1px solid #2c7cff;
            border-radius: 12px;
            color: #5ea3ff;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            text-align: center;
        }
        .link:hover {
            background: rgba(44, 124, 255, 0.25);
            transform: translateY(-2px);
        }
        .divider {
            height: 1px;
            background: rgba(94, 163, 255, 0.2);
            margin: 20px 0;
        }
        .social-links {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .social-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(94, 163, 255, 0.15);
            color: #5ea3ff;
            text-decoration: none;
            transition: all 0.3s ease;
            font-size: 20px;
        }
        .social-link:hover {
            background: rgba(44, 124, 255, 0.25);
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile">
            <div class="avatar">👨‍💼</div>
            <h1 class="name">Douglas Soares</h1>
            <p class="title">Fundador da Dodofy</p>
        </div>

        <div class="links">
            <a href="/consultoria" class="link">📅 Consultoria</a>
            <a href="/orcamento" class="link">💼 Orçamento</a>
            <a href="/mentoria" class="link">🎯 Mentoria</a>
            <a href="/treinamento" class="link">📚 Treinamento</a>
            <a href="/formulario" class="link">📝 Formulário</a>
            <a href="/pops" class="link">📄 POPs</a>
            <a href="/avaliacao" class="link">⭐ Avaliação</a>
        </div>

        <div class="divider"></div>

        <div class="social-links">
            <a href="https://linkedin.com/in/douglasscn" class="social-link" title="LinkedIn">in</a>
            <a href="https://wa.me/556183445168" class="social-link" title="WhatsApp">💬</a>
            <a href="https://instagram.com/douglasscn" class="social-link" title="Instagram">📷</a>
            <a href="https://www.youtube.com/@dodofy" class="social-link" title="YouTube">▶️</a>
        </div>
    </div>
</body>
</html>
